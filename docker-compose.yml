services:
  claude-bot:
    build: .
    image: claude-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Expose for platforms that use inbound webhooks (e.g. WhatsApp)
      - "3000:3000"
    volumes:
      # Persist Wechaty session data (QR login) across restarts
      - wechaty-data:/app/.wechaty
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  wechaty-data:
